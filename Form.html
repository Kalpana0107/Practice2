<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <form action = "https://www.Googlepay.com"> 
        <h1>Payment Form</h1>
        <h2>User Information</h2>
   
    <p>Name : <input type="text" name="name" id="name" required></p>
    
    <fieldset>
        <legend>Gender</legend>
        <p>
            Male <input type="radio" name="gender" id="male">
            Female <input type="radio" name="gender" id="female">
        </p>
    </fieldset>
    <p>Password : <input type="password" name="pass" id="pass"> </p>
    <p>Email Id : <input type="email"> </p>
    <p>Address : <textarea name = "address" rows = "2" cols = "15" id = "address"></textarea> </p>

    <h1>Payment Info</h1>
    <p>Payment method
    <select name = "payment method" id = "payment method">
        <option value = "">--Select any one--</option>
        <option value = "Google pay">Google pay</option>
        <option value = "Phone pay" >Phone pay</option>
        <option value = "Amazon pay">Amazon pay</option>
    </select></p>
    <p>Contact no: <input type="number" name="contact" id="contact"></p>
   
   <input type="button" value="Submit"> 
   <input type="button" value="Reset">


 </form>
</body>
</html>
